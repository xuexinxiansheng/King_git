name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: 安装依赖
        run: pip install -r src/requirements.txt

      - name: 生成构建信息
        shell: pwsh
        run: |
          @(
            "# -*- coding: utf-8 -*-",
            "COMMIT = `"${{ github.sha }}`"",
            "TAG = `"${{ github.ref_name }}`"",
            "BUILT_AT = `"$((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))`""
          ) | Set-Content -Path src/_build_info.py -Encoding utf8

      - name: 打包
        working-directory: src
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --uac-admin
          --name KingdomRushTrainer --icon app.ico
          --add-data "krbridge.dll;." --add-data "payload.lua;."
          trainer.py

      - name: 产物自检
        run: src\dist\KingdomRushTrainer.exe --selftest

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: KingdomRushTrainer
          path: src/dist/KingdomRushTrainer.exe
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: KingdomRushTrainer
          path: dist

      - name: 重命名并生成校验文件
        shell: pwsh
        run: |
          Move-Item dist\KingdomRushTrainer.exe dist\KingdomRush.exe
          $hash = (Get-FileHash dist\KingdomRush.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  KingdomRush.exe" | Set-Content dist\KingdomRush.exe.sha256 -Encoding ascii

      - name: 从 CHANGELOG 生成 Release 说明
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $md = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $pattern = "(?ms)^##\s+" + [regex]::Escape($env:TAG) + "\b.*?(?=^##\s|\z)"
          $body = if ($md -match $pattern) { $Matches[0].Trim() } else { "详见 CHANGELOG.md" }
          $body | Set-Content release-body.md -Encoding UTF8

      - name: 创建或更新草稿 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:TAG 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG dist\KingdomRush.exe dist\KingdomRush.exe.sha256 --clobber
            gh release edit $env:TAG --notes-file release-body.md
          } else {
            gh release create $env:TAG dist\KingdomRush.exe dist\KingdomRush.exe.sha256 `
              --draft --title $env:TAG --notes-file release-body.md
          }
